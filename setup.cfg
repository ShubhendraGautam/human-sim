[metadata]
name = human-sim
version = 0.1.0
description = A deterministic agent-based simulation for studying emergence at scale
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
include =
    src*
    sims*

[options.entry_points]
console_scripts =
    human-sim = sims.simple_sim:main

[flake8]
# The codebase targets the pycodestyle default; this records that as intent
# rather than accident. Enforced by the lint job in CI.
max-line-length = 79
extend-exclude = .venv,venv,build,dist,ui,.git,__pycache__
