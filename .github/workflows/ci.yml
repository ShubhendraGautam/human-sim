name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A branch with an open PR emits both push and pull_request events. Give
  # both runs the same key so only the newest full suite completes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (flake8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install linting tools
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m flake8 src sims tests

  core:
    # The simulation core promises no third-party runtime dependencies.
    # This job installs nothing, so that promise is enforced rather than
    # documented: adding an import outside the standard library fails here.
    name: core (python ${{ matrix.python-version }}, no dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # No install step: the interpreter has only the standard library, so an
      # import added outside it fails here rather than in a user's checkout.
      - name: Import the simulation core
        run: python -c "import src.simulation; print(src.simulation.__name__)"

      - name: Run the test suite
        run: python -m unittest discover -v

  service:
    # Installs the optional API dependencies so the service tests actually
    # execute instead of skipping through their ModuleNotFoundError guard.
    name: service (optional API dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install optional API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt

      - name: Fail if service tests would silently skip
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from src.human_sim_service.api import create_app
          print("service test dependencies import cleanly")
          PY

      - name: Run the test suite
        run: python -m unittest discover -v

  ui:
    name: ui (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/.node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
